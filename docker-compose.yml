version: '3.8'

services:
  nestjs-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs-app-local
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

